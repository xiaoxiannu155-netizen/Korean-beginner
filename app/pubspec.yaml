name: korean_app
description: 韩语启蒙助手 - Korean Beginner Helper
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  dio: ^5.7.0
  just_audio: ^0.9.40
  lottie: ^3.1.2
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
